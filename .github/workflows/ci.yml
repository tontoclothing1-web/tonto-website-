name: CI / Production Build & Security Audit

on:
  push:
    branches: [main, audit-and-fix, cross-platform-perfection]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint & Audit Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Security Vulnerability Scan (Frontend)
        run: npm audit --audit-level=high

      - name: Security Vulnerability Scan (Backend)
        run: npm --prefix backend audit --audit-level=high

      - name: Build Storefront (Vite & Tailwind v4)
        run: npm run build

      - name: Verify Backend Imports & Syntax
        run: node -e "import('./backend/src/app.js').then(() => console.log('Backend app is syntax and import-clean'))"
